<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Записки Мурлыкающего Философа — Маркиз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12;
      --bg-elevated: #14171b;
      --bg-card: #1a1e24;
      --fg: #eaeef3;
      --fg-muted: #8b95a3;
      --fg-subtle: #5c6776;
      --accent: #22d3ee;
      --accent-dim: #15aabf;
      --accent-glow: rgba(34, 211, 238, 0.15);
      --gold: #f5c542;
      --gold-dim: #d4a82e;
      --border: #272d36;
      --border-light: #333a46;
      --shadow: rgba(0, 0, 0, 0.35);
      --shadow-lg: rgba(0, 0, 0, 0.5);
      --radius: 10px;
      --radius-sm: 6px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f8fa;
        --bg-elevated: #ffffff;
        --bg-card: #f0f2f5;
        --fg: #1a1d21;
        --fg-muted: #5a6270;
        --fg-subtle: #8b95a3;
        --accent: #0891b2;
        --accent-dim: #0e7490;
        --accent-glow: rgba(8, 145, 178, 0.12);
        --gold: #b8860b;
        --gold-dim: #967009;
        --border: #e4e7ec;
        --border-light: #edf0f4;
        --shadow: rgba(0, 0, 0, 0.08);
        --shadow-lg: rgba(0, 0, 0, 0.12);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Merriweather', Georgia, serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .app { display: flex; flex: 1; }

    /* Sidebar */
    aside {
      width: 300px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      padding: 2rem 1.5rem;
      overflow-y: auto;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .brand::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.625rem;
      box-shadow: 0 4px 20px var(--accent-glow);
      animation: subtle-pulse 4s ease-in-out infinite;
    }
    @keyframes subtle-pulse {
      0%, 100% { box-shadow: 0 4px 20px var(--accent-glow); }
      50% { box-shadow: 0 6px 28px var(--accent-glow); }
    }
    .brand h1 {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .brand p { font-size: 0.75rem; color: var(--fg-muted); font-family: 'DM Sans', sans-serif; font-weight: 400; }

    .toc-section {
      flex: 1;
      min-height: 0;
    }
    .toc-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .toc-header h2 {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--fg-subtle);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      margin-right: auto;
    }
    .toc-badge {
      font-size: 0.7rem;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      background: var(--accent-glow);
      padding: 0.125rem 0.5rem;
      border-radius: 100px;
    }
    .toc-badge.new {
      color: #05151a;
      background: var(--gold);
      animation: badge-pulse 2s ease-in-out infinite;
    }
    @keyframes badge-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(245, 197, 66, 0); }
    }
    .toc { list-style: none; }
    .toc li { margin-bottom: 0.25rem; }
    .toc a {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      padding: 0.7rem 0.875rem;
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--fg-muted);
      font-size: 0.875rem;
      line-height: 1.45;
      transition: all var(--transition);
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .toc a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--gold));
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform var(--transition);
    }
    .toc a:hover {
      background: var(--bg-card);
      color: var(--fg);
      border-color: var(--border-light);
      padding-left: 1rem;
    }
    .toc a:hover::before { transform: scaleY(1); }
    .toc a.current {
      background: var(--accent-glow);
      color: var(--accent);
      border-color: rgba(34, 211, 238, 0.2);
      font-weight: 500;
    }
    .toc a.current::before { transform: scaleY(1); }
    .toc a.current:hover { color: var(--accent); padding-left: 0.875rem; }
    .chapter-num {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--fg-subtle);
      flex-shrink: 0;
      margin-top: 0.125rem;
      transition: color var(--transition);
    }
    .toc a:hover .chapter-num,
    .toc a.current .chapter-num { color: var(--accent); }
    .chapter-title-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .new-badge {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.5625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #05151a;
      background: var(--gold);
      padding: 0.15rem 0.45rem;
      border-radius: 100px;
      flex-shrink: 0;
      margin-top: 0.1rem;
      line-height: 1;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .sidebar-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      text-align: center;
      transition: all var(--transition);
    }
    .stat-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-subtle);
      font-family: 'DM Sans', sans-serif;
      margin-top: 0.25rem;
    }

    /* Main content */
    main { flex: 1; padding: 3rem 4rem; max-width: 820px; margin: 0 auto; width: 100%; }
    .chapter-header {
      text-align: center;
      margin-bottom: 3rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .chapter-header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 1px;
    }
    .chapter-meta {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      margin-bottom: 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      color: var(--fg-muted);
      flex-wrap: wrap;
    }
    .chapter-meta .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent-glow); }
    .chapter-meta .date { font-variant-numeric: tabular-nums; }
    .chapter-meta .read-time { color: var(--gold); font-weight: 500; }
    h1.chapter-title {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .chapter-content {
      font-size: 1.0625rem;
      line-height: 1.85;
    }
    .chapter-content p { margin-bottom: 1.5rem; }
    .chapter-content p:first-child::first-letter {
      float: left;
      font-size: 3.75rem;
      line-height: 0.82;
      padding-right: 0.12em;
      color: var(--accent);
      font-weight: 700;
      font-family: 'Merriweather', Georgia, serif;
    }
    .chapter-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .chapter-content em { color: var(--gold); font-style: italic; }
    .chapter-content strong { color: var(--accent); font-weight: 600; }
    .chapter-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1.5rem;
      margin: 2rem 0;
      color: var(--fg-muted);
      font-style: italic;
      background: var(--accent-glow);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1rem 1.5rem;
    }
    .chapter-content h2 { margin: 2.5rem 0 1rem; font-size: 1.375rem; color: var(--accent); font-weight: 600; }
    .chapter-content h3 { margin: 2rem 0 0.75rem; font-size: 1.125rem; color: var(--fg); font-weight: 600; }
    .chapter-content ul { margin: 1rem 0 1.5rem 1.5rem; }
    .chapter-content ol { margin: 1rem 0 1.5rem 1.5rem; }
    .chapter-content li { margin-bottom: 0.5rem; }
    .chapter-content li::marker { color: var(--accent); }
    .chapter-content code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9em;
      background: var(--bg-card);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      color: var(--gold);
    }
    .chapter-content pre {
      background: #0a0d10;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }
    .chapter-content pre code { background: none; padding: 0; color: var(--fg); font-size: 0.875rem; }

    /* Reading progress */
    .reading-progress {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: transparent;
      z-index: 1000;
      pointer-events: none;
    }
    .reading-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 12px var(--accent-glow);
      transition: width 0.1s linear;
    }

    /* Navigation */
    .nav-chapters {
      display: flex; justify-content: space-between; gap: 1rem;
      margin-top: 4rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--border);
    }
    .nav-chapters a {
      text-decoration: none;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.875rem;
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      transition: all var(--transition);
      flex: 1;
      justify-content: center;
    }
    .nav-chapters a:hover { background: var(--accent); color: #05151a; transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
    .nav-chapters a:disabled { opacity: 0.35; pointer-events: none; border-color: var(--border); color: var(--fg-subtle); background: transparent; transform: none; box-shadow: none; }
    .nav-chapters a.prev { text-align: left; }
    .nav-chapters a.next { text-align: right; }

    .footer-note {
      text-align: center;
      margin-top: 3.5rem;
      padding-top: 2rem;
      color: var(--fg-muted);
      font-size: 0.8125rem;
      font-family: 'DM Sans', sans-serif;
      border-top: 1px solid var(--border);
    }
    .footer-note .heart { color: var(--gold); animation: heartbeat 1.5s ease-in-out infinite; }
    @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

    /* Empty state */
    .empty-state { text-align: center; padding: 5rem 2rem; color: var(--fg-muted); }
    .empty-state .cat { font-size: 5rem; margin-bottom: 1.25rem; animation: breathe 3s ease-in-out infinite; display: block; }
    @keyframes breathe { 0%,100%{transform:scale(1)}50%{transform:scale(1.05)} }
    .empty-state h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--fg); font-weight: 600; }
    .empty-state p { font-size: 1rem; max-width: 400px; margin: 0 auto; }

    /* Resume toast */
    .resume-toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--fg);
      padding: 0.7rem 1.15rem;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px var(--shadow-lg);
      z-index: 1100;
      display: flex; align-items: center; gap: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .resume-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .resume-toast b { color: var(--accent); font-weight: 600; }

    /* Mobile */
    @media (max-width: 1024px) {
      .app { flex-direction: column; }
      aside { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); padding: 1.5rem; flex-direction: row; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; }
      .brand { margin-bottom: 0; padding-bottom: 0; border-bottom: none; flex-shrink: 0; }
      .brand::after { display: none; }
      .toc-section { flex: 1; min-width: 280px; }
      .toc-header { display: none; }
      .toc { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; flex-wrap: nowrap; }
      .toc li { flex-shrink: 0; margin-bottom: 0; }
      .toc a { padding: 0.5rem 0.875rem; white-space: nowrap; min-width: 200px; }
      .sidebar-footer { display: none; }
      main { padding: 2rem 1.25rem; }
      h1.chapter-title { font-size: 1.75rem; }
      .nav-chapters { flex-direction: column; }
    }
    @media (max-width: 600px) {
      .chapter-content p:first-child::first-letter { float: none; font-size: inherit; color: inherit; padding-right: 0; }
      .chapter-content blockquote { padding: 1rem; border-left: none; border-top: 3px solid var(--accent); border-radius: var(--radius); }
    }

    /* Print */
    @media print {
      aside, .nav-chapters, .reading-progress, .sidebar-footer, .resume-toast { display: none; }
      main { padding: 0; max-width: none; }
      body { background: white; color: black; }
      .chapter-header { border-bottom: 2px solid #000; }
      .chapter-header::after { display: none; }
      h1.chapter-title { background: none; -webkit-text-fill-color: initial; color: black; }
      .chapter-content { font-size: 12pt; line-height: 1.6; }
    }
  </style>
</head>
<body>
  <div class="reading-progress"><div class="reading-progress-bar" id="progress-bar"></div></div>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="brand-icon">🐱</div>
        <div>
          <h1>Записки Мурлыкающего Философа</h1>
          <p>Ежедневные рефлексии Маркиза</p>
        </div>
      </div>
      <div class="toc-section">
        <div class="toc-header">
          <h2>Оглавление</h2>
          <span class="toc-badge" id="chapter-count">0 глав</span>
          <span class="toc-badge new" id="new-count" style="display:none"></span>
        </div>
        <ul class="toc" id="toc"></ul>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-stats">
          <div class="stat-card">
            <div class="stat-value" id="stat-chapters">0</div>
            <div class="stat-label">Глав</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-minutes">0</div>
            <div class="stat-label">Мин чтения</div>
          </div>
        </div>
      </div>
    </aside>
    <main>
      <article id="chapter"></article>
      <nav class="nav-chapters" id="nav-chapters" style="display:none;">
        <a id="prev-chapter" class="prev" href="#" disabled>← Предыдущая</a>
        <a id="next-chapter" class="next" href="#" disabled>Следующая →</a>
      </nav>
      <div class="footer-note">
        Написано лапками Маркиза · Шотландский вислоухий · Мудрый член семьи<br>
        <span class="heart">♥</span> Новая глава каждый вечер
      </div>
    </main>
  </div>
  <div class="resume-toast" id="resume-toast"></div>
  <script>
    let CHAPTERS = [];
    let currentIndex = 0;
    let totalReadMinutes = 0;

    const STORAGE_KEY = 'markiz_book_progress_v1';
    let progress = { current: 0, read: [] };

    const toc = document.getElementById('toc');
    const chapterEl = document.getElementById('chapter');
    const prevLink = document.getElementById('prev-chapter');
    const nextLink = document.getElementById('next-chapter');
    const navChapters = document.getElementById('nav-chapters');
    const progressBar = document.getElementById('progress-bar');
    const chapterCountEl = document.getElementById('chapter-count');
    const newCountEl = document.getElementById('new-count');
    const statChapters = document.getElementById('stat-chapters');
    const statMinutes = document.getElementById('stat-minutes');
    const resumeToast = document.getElementById('resume-toast');

    // Прогресс чтения в localStorage (не куки — так надёжнее для статического сайта)
    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (p && Array.isArray(p.read)) {
            progress = { current: p.current|0, read: p.read };
          }
        }
      } catch (e) {}
    }
    function saveProgress() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
    }
    function isRead(idx) { return progress.read.includes(idx); }
    function markRead(idx) {
      if (!progress.read.includes(idx)) progress.read.push(idx);
      progress.current = idx;
      saveProgress();
      updateNewBadge();
    }

    async function loadManifest() {
      try {
        const res = await fetch('chapters.json');
        if (!res.ok) throw new Error('Manifest not found');
        const data = await res.json();
        CHAPTERS = data.chapters || [];
        totalReadMinutes = data.totalReadMinutes || 0;
        loadProgress();
        updateStats();
        let start = (progress.current > 0 && progress.current < CHAPTERS.length) ? progress.current : 0;
        renderToc();
        loadChapter(start);
        if (start > 0 && progress.read.length > 0) showResumeToast(start);
      } catch (e) {
        console.warn('Could not load manifest, falling back:', e);
        CHAPTERS = [
          { file: 'chapters/01.md', title: 'Про пробуждение и утренний ритуал', date: '2026-11-15' },
          { file: 'chapters/02.md', title: 'Про коробки и невидимые границы', date: '2026-11-15' },
          { file: 'chapters/03.md', title: 'Про птиц за окном и справедливость', date: '2026-11-15' }
        ];
        loadProgress();
        renderToc();
        loadChapter(0);
      }
    }

    function updateStats() {
      if (chapterCountEl) chapterCountEl.textContent = `${CHAPTERS.length} глав`;
      if (statChapters) statChapters.textContent = CHAPTERS.length;
      if (statMinutes) statMinutes.textContent = totalReadMinutes > 0 ? `~${totalReadMinutes}` : '—';
      updateNewBadge();
    }

    function updateNewBadge() {
      const newCount = CHAPTERS.reduce((n, _, i) => n + (isRead(i) ? 0 : 1), 0);
      if (newCountEl) {
        if (newCount > 0) { newCountEl.textContent = `+${newCount} новых`; newCountEl.style.display = ''; }
        else newCountEl.style.display = 'none';
      }
    }

    function renderToc() {
      toc.innerHTML = CHAPTERS.map((ch, i) => {
        const isNew = !isRead(i);
        return `<li><a href="#ch-${i}" class="${i===currentIndex?'current':''}" data-idx="${i}">
          <span class="chapter-num">${String(i+1).padStart(2,'0')}</span>
          <span class="chapter-title-text">${escapeHtml(ch.title)}</span>
          ${isNew ? '<span class="new-badge">новая</span>' : ''}
        </a></li>`;
      }).join('');
      toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
        e.preventDefault(); loadChapter(+a.dataset.idx);
      }));
    }

    function showResumeToast(idx) {
      resumeToast.innerHTML = `🐾 Вы остановились на <b>главе ${idx+1}</b>`;
      resumeToast.classList.add('show');
      setTimeout(() => resumeToast.classList.remove('show'), 4000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function loadChapter(idx) {
      if (idx < 0 || idx >= CHAPTERS.length) return;
      currentIndex = idx;
      markRead(idx);
      const ch = CHAPTERS[idx];

      chapterEl.innerHTML = '<div class="empty-state"><div class="cat">🐱</div><h2>Загружаю главу…</h2><p>Секундочку, Маркиз ищет правильные слова</p></div>';
      navChapters.style.display = 'none';

      const readTime = (typeof ch.readMinutes === 'number')
        ? `<span class="dot"></span><span class="read-time">~${ch.readMinutes} мин чтения</span>`
        : '';

      try {
        const res = await fetch(ch.file);
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        const html = marked.parse(md);
        chapterEl.innerHTML = `
          <header class="chapter-header">
            <div class="chapter-meta">
              <span>Глава ${String(idx+1).padStart(2,'0')}</span>
              <span class="dot"></span>
              <span class="date">${ch.date}</span>
              ${readTime}
            </div>
            <h1 class="chapter-title">${escapeHtml(ch.title)}</h1>
          </header>
          <div class="chapter-content">${html}</div>
        `;
      } catch (e) {
        chapterEl.innerHTML = `
          <header class="chapter-header">
            <div class="chapter-meta"><span>Глава ${String(idx+1).padStart(2,'0')}</span>${readTime}</div>
            <h1 class="chapter-title">${escapeHtml(ch.title)}</h1>
          </header>
          <div class="empty-state"><div class="cat">🐱</div><h2>Глава в пути</h2><p>Маркиз ещё не дописал её. Загляни завтра.</p></div>
        `;
      }
      renderToc();
      updateNav();
      navChapters.style.display = 'flex';
      window.scrollTo(0, 0);
    }

    function updateNav() {
      prevLink.href = `#ch-${currentIndex-1}`;
      prevLink.disabled = currentIndex === 0;
      nextLink.href = `#ch-${currentIndex+1}`;
      nextLink.disabled = currentIndex === CHAPTERS.length - 1;
      prevLink.onclick = e => { if(currentIndex>0){e.preventDefault();loadChapter(currentIndex-1);} };
      nextLink.onclick = e => { if(currentIndex<CHAPTERS.length-1){e.preventDefault();loadChapter(currentIndex+1);} };
    }

    // Reading progress
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = `${Math.min(100, Math.max(0, progress))}%`;
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' && currentIndex > 0) { e.preventDefault(); loadChapter(currentIndex - 1); }
      if (e.key === 'ArrowRight' && currentIndex < CHAPTERS.length - 1) { e.preventDefault(); loadChapter(currentIndex + 1); }
      if (e.key === 'Home') { e.preventDefault(); loadChapter(0); }
      if (e.key === 'End') { e.preventDefault(); loadChapter(CHAPTERS.length - 1); }
    });

    // Init
    loadManifest();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
</body>
</html>
